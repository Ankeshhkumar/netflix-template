<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Netflix</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --red:#e50914;
  --bg:#141414;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  color:#fff;
  font-family:'Inter',sans-serif;
  overflow:hidden;
}

/* 🔥 Smooth animation */
.screen{
  position:absolute;
  inset:0;
  opacity:0;
  transform:scale(1.05);
  transition:opacity .5s ease, transform .5s ease;
}
.screen.active{
  opacity:1;
  transform:scale(1);
}

.netflix-word{
  font-family:'Bebas Neue';
  color:var(--red);
}

/* INTRO */
#screen-intro{
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
}
.intro-logo{
  font-size:20vw;
  color:var(--red);
}

/* PROFILES */
#screen-profiles{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.profile{
  cursor:pointer;
}
.profile-pic{
  width:90px;height:90px;
  background:#333;
  border-radius:6px;
}
.profile:active .profile-pic{
  transform:scale(0.95);
}

/* HERO */
.hero{
  height:60vh;
  display:flex;
  align-items:flex-end;
  padding:20px;
  background:#333 center/cover;
}
.hero-title{
  font-size:40px;
  font-family:'Bebas Neue';
  text-shadow:0 0 10px rgba(229,9,20,0.6);
}
[contenteditable="true"]:focus{
  outline:none;
  border-bottom:1px dashed rgba(255,255,255,0.3);
}

/* VIDEO */
#screen-video{
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}
.video-frame{
  width:100%;
  height:100%;
  position:relative;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* NAV */
.navigator{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
}
.nav-btn{
  margin:4px;
}

/* CREDITS */
#screen-credits{
  display:flex;
  justify-content:center;
  align-items:center;
}
</style>
</head>

<body>

<!-- 🎵 BACKGROUND MUSIC -->
<audio id="bg-music" loop>
  <source src="your-music.mp3" type="audio/mpeg">
</audio>

<div id="screen-intro" class="screen active">
  <div class="intro-logo">N</div>
</div>

<div id="screen-profiles" class="screen">
  <h2>Who's watching?</h2>
  <div class="profile" onclick="goTo('home')">
    <div class="profile-pic"></div>
    <div contenteditable="true">Us ❤️</div>
  </div>
</div>

<div id="screen-home" class="screen">
  <div class="hero">
    <div>
      <div class="hero-title" contenteditable="true">
        Our Story ❤️
      </div>
      <button onclick="goTo('video')">Play ▶</button>
    </div>
  </div>
</div>

<div id="screen-video" class="screen">
  <div class="video-frame">

    <!-- 🎬 REAL VIDEO -->
    <video id="real-video" controls style="display:none;"></video>

    <button id="video-upload-btn"
      onclick="document.getElementById('video-upload').click()">
      Upload Video / Image
    </button>

    <input type="file" id="video-upload" accept="image/*,video/*">
  </div>
</div>

<div id="screen-credits" class="screen">
  <div>
    <h2>Made with ❤️</h2>
    <div contenteditable="true">Your Name</div>
  </div>
</div>

<!-- NAV -->
<div class="navigator">
  <button class="nav-btn" onclick="goTo('intro')">Intro</button>
  <button class="nav-btn" onclick="goTo('profiles')">Profiles</button>
  <button class="nav-btn" onclick="goTo('home')">Home</button>
  <button class="nav-btn" onclick="goTo('video')">Video</button>
  <button class="nav-btn" onclick="goTo('credits')">Credits</button>
</div>

<script>
const screens=['intro','profiles','home','video','credits'];

function goTo(name){
  screens.forEach(s=>{
    document.getElementById('screen-'+s)
      .classList.toggle('active',s===name);
  });
}

/* 🎬 VIDEO UPLOAD */
document.getElementById('video-upload').addEventListener('change', e=>{
  const file=e.target.files[0];
  if(!file) return;

  const url=URL.createObjectURL(file);
  const video=document.getElementById('real-video');

  if(file.type.startsWith('video')){
    video.src=url;
    video.style.display='block';
    document.getElementById('video-upload-btn').style.display='none';
  }
});

/* 🎵 MUSIC PLAY */
document.body.addEventListener('click',()=>{
  const music=document.getElementById('bg-music');
  if(music.paused){
    music.play().catch(()=>{});
  }
},{once:true});

/* 💾 STORAGE FIX */
window.addEventListener('beforeunload',()=>{
  localStorage.setItem('saved','true');
});

/* ⚡ AUTO SKIP INTRO */
setTimeout(()=>goTo('profiles'),2800);
</script>

</body>
</html>
