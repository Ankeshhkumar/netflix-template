<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Netflix</title>

<link rel="manifest" href="manifest.json">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=Inter:wght@400;600&display=swap');

:root{
  --red:#e50914;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:'Inter';
  overflow:hidden;
}

/* Smooth transitions */
.screen{
  position:absolute;
  inset:0;
  opacity:0;
  transform:scale(1.05);
  transition:all .5s;
  pointer-events:none;
}
.screen.active{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
}

/* Intro */
#screen-intro{
  display:flex;
  justify-content:center;
  align-items:center;
}
.intro-logo{
  font-size:22vw;
  color:var(--red);
  animation:introZoom 2.8s forwards;
}
@keyframes introZoom{
  0%{transform:scale(.6);opacity:0;}
  40%{transform:scale(1.1);opacity:1;}
  100%{opacity:0;}
}

/* Hero */
.hero{
  height:60vh;
  display:flex;
  align-items:flex-end;
  padding:20px;
  background:#333 center/cover;
}
.hero-title{
  font-family:'Bebas Neue';
  font-size:48px;
  text-shadow:0 0 10px rgba(229,9,20,0.6);
}

/* Editable fix */
[contenteditable]:focus{
  outline:none;
  border-bottom:1px dashed #aaa;
}

/* Video */
video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Confetti */
#confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="bg-music" loop>
  <source src="your-music.mp3" type="audio/mpeg">
</audio>

<audio id="intro-sound">
  <source src="intro.mp3">
</audio>

<canvas id="confetti"></canvas>

<!-- INTRO -->
<div id="screen-intro" class="screen active">
  <div class="intro-logo">N</div>
</div>

<!-- PROFILES -->
<div id="screen-profiles" class="screen">
  <h2>Who's watching?</h2>
  <div onclick="goTo('home')">❤️ Us</div>
</div>

<!-- HOME -->
<div id="screen-home" class="screen">
  <div class="hero">
    <div>
      <div class="hero-title" contenteditable="true">Our Story ❤️</div>
      <button onclick="goTo('video')">Play ▶</button>
    </div>
  </div>
</div>

<!-- VIDEO -->
<div id="screen-video" class="screen">
  <video id="real-video" controls style="display:none"></video>
  <button onclick="upload()">Upload</button>
  <input type="file" id="video-upload" hidden>
  <div id="video-caption"></div>
</div>

<!-- CREDITS -->
<div id="screen-credits" class="screen">
  <h2>Made with ❤️</h2>
</div>

<script>

/* Navigation */
const screens=['intro','profiles','home','video','credits'];
function goTo(name){
  screens.forEach(s=>{
    document.getElementById('screen-'+s)
    .classList.toggle('active',s===name);
  });

  if(name==='video'){
    typeText(document.getElementById('video-caption'),
    "every moment with you feels like the best scene ❤️");
  }

  if(name==='credits'){
    startConfetti();
  }
}

/* Intro click */
document.getElementById('screen-intro').onclick=()=>{
  document.getElementById('intro-sound').play().catch(()=>{});
  goTo('profiles');
};

/* Auto intro */
setTimeout(()=>goTo('profiles'),2800);

/* Music */
document.body.addEventListener('click',()=>{
  const m=document.getElementById('bg-music');
  if(m.paused) m.play().catch(()=>{});
},{once:true});

/* Upload */
function upload(){
  document.getElementById('video-upload').click();
}
document.getElementById('video-upload').addEventListener('change',e=>{
  const file=e.target.files[0];
  const url=URL.createObjectURL(file);
  const v=document.getElementById('real-video');

  if(file.type.startsWith('video')){
    v.src=url;
    v.style.display='block';
    v.play();
  }
});

/* Typing */
function typeText(el,text){
  let i=0;
  el.innerHTML='';
  function t(){
    if(i<text.length){
      el.innerHTML+=text[i++];
      setTimeout(t,40);
    }
  }
  t();
}

/* Confetti */
function startConfetti(){
  const c=document.getElementById('confetti');
  const ctx=c.getContext('2d');
  c.width=innerWidth;
  c.height=innerHeight;

  const p=Array.from({length:80},()=>({
    x:Math.random()*c.width,
    y:Math.random()*c.height
  }));

  setInterval(()=>{
    ctx.clearRect(0,0,c.width,c.height);
    p.forEach(i=>{
      i.y+=3;
      ctx.fillStyle="red";
      ctx.fillRect(i.x,i.y,4,4);
      if(i.y>c.height) i.y=0;
    });
  },30);
}

/* PWA */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}

</script>

</body>
</html>
